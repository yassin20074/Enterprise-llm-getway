version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: gateway_redis
    ports:
      - "6379:6379"
    restart: always

  gateway:
    build: .
    container_name: llm_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: gateway_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: gateway_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always